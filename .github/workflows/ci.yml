name: CI

on:
  push:
    branches: [001]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          # Dummy key so agents.*'s module-level anthropic.Anthropic() clients
          # construct successfully — every test mocks the actual API calls,
          # so this key is never used to make a real, billable request.
          ANTHROPIC_API_KEY: sk-ci-dummy-key
        # `python -m pytest` (not bare `pytest`) so the backend directory
        # itself lands on sys.path — otherwise `import db` etc. fail here
        # even though they work locally where a stale sys.path lingers.
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
